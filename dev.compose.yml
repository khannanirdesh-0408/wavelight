# dev.compose.yml

name: lisdex-dev

services:
  toolchain:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: lisdex-dev-toolchain:latest
    container_name: lisdex-dev-toolchain
    init: true
    shm_size: 2gb
    ulimits:
      core: 0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CORSAIR_API_KEY=ck_dev_sec_9941a37c98f10b2d6a
      - CORSAIR_KEK=k3k_b64_9a8f27e10c55490ba8208f6d7c9281a4b5d6e7f8
      - CORSAIR_HUB_URL=https://hub.corsair.dev
      - CORSAIR_DOCS_URL=https://docs.corsair.dev/
      - CORSAIR_TENANT_ID=cybersecurity-lab
      AFL_SKIP_CPUFREQ: "1"
      AFL_NO_AFFINITY: "1"
      AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
      RUST_BACKTRACE: "1"
      LISDEX_LLM_ENDPOINT: "http://host.docker.internal:${LISDEX_OLLAMA_PORT:-49327}"
    ports:
      - "127.0.0.1:${LISDEX_CONSOLE_PORT:-47119}:47119"
    volumes:
      - .:/work
      - cargo-target:/cargo-target
      - magma-work:/opt/magma-work
    working_dir: /work
    command: ["sleep", "infinity"]

volumes:
  cargo-target:
  magma-work:
